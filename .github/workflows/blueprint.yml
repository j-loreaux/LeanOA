name: Build project
on:
  push:
    branches:
      - master
    paths:
      - '**/*.lean'
      - '.github/workflows/blueprint.yml'
      - 'LeanOABlueprint/**'
      - 'home_page/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.lean'
      - '.github/workflows/blueprint.yml'
      - 'LeanOABlueprint/**'
      - 'home_page/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# We do not cancel CI on main so as to keep all commits green (cancelling CI on a commit makes it
# red).

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and modify PR labels
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  style_lint:
    name: Lint style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Don't 'import Mathlib', use precise imports
        if: always()
        run: |
          ! (find LeanOA -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^import Mathlib$')

  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@v1
        with:
          build: true
          lint: true
          mk_all-check: true

      - name: Generate upstream dashboard snippets
        uses: leanprover-community/upstreaming-dashboard-action@main
        with:
          website-directory: home_page
          project-name: LeanOA
          branch-name: master

      # Needed only by `vbp build --pdf`; the HTML site has no LaTeX dependency.
      - name: Install TeX Live for the blueprint PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pygments \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic

      # `lake build LeanOABlueprint` is a separate step because the blueprint is not a default
      # target (see lakefile.toml). It is also the check that replaces `checkdecls`: a statement
      # whose `(lean := "...")` name does not resolve is a build error here.
      - name: Build the Verso blueprint
        run: |
          lake build LeanOABlueprint
          lake exe vbp build --pdf

      # Hand the generated site to Jekyll at the same URLs the leanblueprint site used:
      # `/blueprint/` for the web version and `/blueprint.pdf` for the print version.
      - name: Stage the blueprint for GitHub Pages
        run: |
          test -f _out/site/html-multi/index.html
          test -f _out/site/html-multi/-verso-data/blueprint-manifest.json
          rm -rf home_page/blueprint
          cp -r _out/site/html-multi home_page/blueprint
          cp _out/site/pdf/main.pdf home_page/blueprint.pdf

      - name: Compile documentation and home page
        uses: leanprover-community/docgen-action@main
        with:
          blueprint: false # the blueprint is built above by Verso, not by leanblueprint
          homepage: home_page
          ruby-version: default # read home_page/.ruby-version
